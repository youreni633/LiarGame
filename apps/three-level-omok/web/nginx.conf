server {
  listen 8080;
  root /usr/share/nginx/html;
  location /threemok/ { try_files $uri $uri/ /threemok/index.html; }
  location /api/ { proxy_pass http://server:3100; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /threemok/socket.io/ { proxy_pass http://server:3100; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }
}
